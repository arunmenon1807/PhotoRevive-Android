name: PhotoRevive APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photorevive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Free space for Android emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reuse debug signing key for subsequent builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photorevive-debug-keystore-v1
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build, unit tests and lint
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2G
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Verify APK signature and offline permissions
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          apkanalyzer manifest permissions "$APK" > permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then exit 1; fi
          cp "$APK" PhotoRevive-debug.apk
          sha256sum PhotoRevive-debug.apk > PhotoRevive-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoRevive-debug
          path: |
            PhotoRevive-debug.apk
            PhotoRevive-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/
